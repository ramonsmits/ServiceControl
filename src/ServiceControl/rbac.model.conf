# ServiceControl RBAC model for Casbin (S4 variant).
#
# Overview of sections (PERM metamodel):
#
# [request_definition]  — shape of an Enforce(sub, perm, res) call
#   sub  = subject identifier (e.g. "alice@acme.com")
#   perm = permission string (e.g. "messages:retry")
#   res  = concrete resource being acted on (e.g. "Sales.Orders@localhost")
#
# [policy_definition]   — shape of a compiled policy line
#   sub  = role identifier with "role:" prefix (e.g. "role:sc-operator")
#   perm = permission string matched against r.perm
#   res  = glob pattern matched against r.res (e.g. "Sales.*", "*")
#   eft  = "allow" or "deny"
#
# [role_definition]     — g(user, role) lets user identity resolve to role membership.
#   Compiled as "g, alice@example.com, role:sc-operator" lines from rbac.yaml bindings.
#
# [policy_effect]       — deny-override: allow if any line allows AND no line denies.
#   This gives explicit deny lines the ability to carve out exceptions from wider allow grants.
#
# [matchers]            — how a request matches a policy line:
#   g(r.sub, p.sub)       → user belongs to role (role resolution via the g table)
#   r.perm == p.perm      → permission string exact match
#   globMatch(r.res,p.res)→ resource matches the policy's glob pattern ("*" matches all)

[request_definition]
r = sub, perm, res

[policy_definition]
p = sub, perm, res, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = g(r.sub, p.sub) && r.perm == p.perm && globMatch(r.res, p.res)
